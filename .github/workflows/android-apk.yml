name: Romtran Android APK
on:
  push:
    branches: [main, master]
    paths: ["android_app/**", ".github/workflows/android-apk.yml"]
  pull_request:
    branches: [main, master]
    paths: ["android_app/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip python3-pip python3-venv \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer>=1.5.0" "cython<3"
      - name: Build debug APK
        working-directory: android_app
        shell: bash
        run: |
          set -o pipefail
          buildozer android debug 2>&1 | tee "$RUNNER_TEMP/buildozer.log"
      - name: Report build error
        if: failure()
        shell: bash
        run: |
          log="$RUNNER_TEMP/buildozer.log"
          [ -f "$log" ] || exit 0
          clean() { sed 's/\x1b\[[0-9;]*[A-Za-z]//g' | grep -vE '^[[:space:]]*$' | cut -c1-300; }
          annotate() {
            local title="$1" msg="$2"
            msg="${msg//'%'/'%25'}"; msg="${msg//$'\r'/'%0D'}"; msg="${msg//$'\n'/'%0A'}"
            echo "::error title=${title}::${msg}"
          }
          annotate "Buildozer: error lines" "$(clean < "$log" | grep -iE 'error|exception|traceback|failed|not found|no such' | tail -n 25)"
          first=$(clean < "$log" | grep -nE 'Traceback|error:' | head -n 1 | cut -d: -f1)
          if [ -n "$first" ]; then
            start=$(( first > 30 ? first - 30 : 1 ))
            annotate "Buildozer: around first error" "$(clean < "$log" | sed -n "${start},$(( first + 25 ))p")"
          fi
          annotate "Buildozer: last lines" "$(clean < "$log" | tail -n 35)"
      - uses: actions/upload-artifact@v4
        with:
          name: romtran-android-debug-apk
          path: android_app/bin/*.apk
          if-no-files-found: error
          retention-days: 14
