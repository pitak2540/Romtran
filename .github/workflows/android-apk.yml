name: Romtran Android APK
on:
  push:
    branches: [main, master]
    paths: ["android_app/**", ".github/workflows/android-apk.yml"]
  pull_request:
    branches: [main, master]
    paths: ["android_app/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip python3-pip python3-venv \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer>=1.5.0" "cython<3"
      - name: Build debug APK
        working-directory: android_app
        run: buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: romtran-android-debug-apk
          path: android_app/bin/*.apk
          if-no-files-found: error
          retention-days: 14
